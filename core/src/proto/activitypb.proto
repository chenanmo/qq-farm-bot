    YshfShopQueryReply yshf_shop = 192;
    YshfSellReply yshf_sell = 193;
    YshfRecordReply yshf_records = 195;
    YshfExchangeReply yshf_exchange = 196;
    YshfCatalog yshf_catalog = 197;
    YshfShareReply yshf_share = 198;
    YshfCommissionReply yshf_commission = 199;
    QingMeiSettlement qingmei_settlement = 115;
    QixiGiftResult qixi_gift_result = 125;
